# CI of the app: builds and tests the Release profile, the Kazo OS packages from nuget.org at the
# version of the submodule (ADR 0176 §4, §6). This is what the Kazo OS Store compiles.
# The steps live in the reusable workflow kazoos-ci.yml of Kazo-ca/Os-AppTemplate (ADR 0271 §7).
#
# workflow_call lets the DeckCraft build workflow test the branch it pushes, since a push made with
# the workflow token starts no workflow. Only the Kazo OS submodule is fetched: the app uses the
# DeckCraft build committed in wwwroot/, and DeckCraft's sources are only needed to compile it.
name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Branch to check out and test
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: "ci-${{ inputs.ref || github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    uses: Kazo-ca/Os-AppTemplate/.github/workflows/kazoos-ci.yml@v1
    with:
      ref: ${{ inputs.ref || '' }}

  # The iframe page's slide-show script (work item 4), on a fake page: Node only, no browser and no
  # npm install (the repository keeps no npm lock file, so the shared workflow's npm-test is off).
  page-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || '' }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Test the page scripts
        run: node --test tests/unit/*.test.mjs
